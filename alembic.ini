# Alembic configuration.
#
# The database URL is NOT stored here: it is read from the application's settings
# (environment / .env / config.yaml) inside migrations/env.py, so credentials never
# live in a committed file and there is exactly one source of configuration truth.
#
# Apply migrations:
#     make migrate           # upgrade to head
#     make migrate-down      # one step back
#     make migration m="..." # autogenerate a new revision
[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os

# Naming conventions make autogenerated constraint names deterministic, so a
# downgrade can reliably drop what an upgrade created.
[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
