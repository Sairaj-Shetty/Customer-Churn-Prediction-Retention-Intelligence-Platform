[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-platform"
version = "0.1.0"
description = "Customer Churn Prediction & Retention Intelligence Platform — end-to-end MLOps system"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Sairaj Shetty" }]

# Core runtime dependencies. Lower bounds are intentionally conservative;
# the exact tested versions live in requirements.lock.txt.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "xgboost>=2.0",
    "joblib>=1.3",
    "PyYAML>=6.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",
    "shap>=0.44",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.optional-dependencies]
# Everything the API server needs.
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "prometheus-client>=0.19",
]
# Experiment tracking, tuning and drift monitoring.
mlops = [
    "mlflow>=2.10",
    "optuna>=3.5",
    "evidently>=0.4.30",
    "dvc>=3.0",
]
# Dashboard. Calls the API over HTTP; never imports the model itself.
frontend = ["streamlit>=1.31", "requests>=2.31"]
# Test + lint tooling.
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    # starlette.testclient (used for the API tests) needs a transport. Newer
    # starlette releases require httpx2 specifically and fail at import time
    # without it, so both are declared rather than relying on httpx alone.
    "httpx>=0.27",
    "httpx2>=0.27",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.scripts]
churn-ingest = "churn.data.ingest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: marks tests that train models or hit the network (deselect with '-m \"not slow\"')",
    "integration: requires a database",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/churn", "api"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "api", "tests", "frontend"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # comprehensions
    "SIM", # simplify
]
ignore = ["E501", "B008"]  # line length handled by formatter; B008 = FastAPI Depends() default

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402"]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
exclude = ["notebooks", "frontend"]
