# DVC pipeline — reproducible stages from raw bytes to evaluated model.
#
# Every stage declares its exact inputs and outputs, so `dvc repro` re-executes
# only what changed and `dvc dag` shows the lineage. Combined with the SHA-256
# check in churn.data.ingest, any committed .dvc file maps to model artifacts
# that provably came from the canonical dataset.

stages:
  ingest:
    desc: Download and SHA-256-verify the raw IBM Telco dataset.
    cmd: .venv/bin/python -m churn.data.ingest
    deps:
      - src/churn/data/ingest.py
      - src/churn/constants.py
    outs:
      - data/raw/Telco-Customer-Churn.csv:
          cache: true
    metrics:
      - data/raw/dataset.meta.json:
          cache: false

  validate:
    desc: Enforce the data schema contract before anything is trained.
    cmd: .venv/bin/python -m churn.data.validate
    deps:
      - src/churn/data/validate.py
      - src/churn/constants.py
      - data/raw/Telco-Customer-Churn.csv
    always_changed: false

  split:
    desc: Coerce dtypes (TotalCharges to numeric; NaN preserved) then split 60/20/20.
    cmd: .venv/bin/python -m churn.data.split
    deps:
      - src/churn/data/split.py
      - src/churn/data/validate.py
      - configs/config.yaml
      - data/raw/Telco-Customer-Churn.csv
    # Track the real config file (not a duplicated params.yaml) so the split
    # is invalidated whenever the configured proportions or seed change.
    params:
      - configs/config.yaml:
          - data.val_size
          - data.test_size
          - data.random_state
    outs:
      - data/processed/train.parquet
      - data/processed/validation.parquet
      - data/processed/test.parquet
    metrics:
      - data/processed/split_metadata.json:
          cache: false

  eda:
    desc: Compute statistics and render the EDA report and figures.
    cmd: .venv/bin/python -m churn.data.eda
    deps:
      - src/churn/data/eda.py
      - data/raw/Telco-Customer-Churn.csv
    outs:
      - reports/eda_report.md:
          cache: false
      - reports/figures:
          cache: false
